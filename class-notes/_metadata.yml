# Settings for the section 2 class-notes pages (generated by the private course repo).
# The notes' `# ` title becomes the page title, and ```mermaid blocks are drawn: in a .md
# file Quarto leaves them as code, with no Mermaid script on the page.
shift-heading-level-by: -1
include-after-body:
  text: |
    <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs";
    mermaid.run({ querySelector: "pre.mermaid" });
    </script>
