[project]
name = "dsci-522-slides-section-001"
version = "0.1.0"
description = "Slides for DSCI 522 (Reproducible and Trustworthy Data Science Workflows) Section 001"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter-client>=8.10.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
]

# Only needed by scripts/generate_images.py, not by `quarto render`.
# Install with: uv sync --group images
[dependency-groups]
images = [
    "openai>=2.9.0",
    "python-dotenv>=1.1.0",
]
