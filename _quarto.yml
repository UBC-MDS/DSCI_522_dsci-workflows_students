project:
  type: website
  # Every page is rendered.
  # Students only find a page through the navbar and sidebars,
  # so release an assignment or cheatsheet by uncommenting its entry below.
  # The source files are public in this repo anyway.
  render:
    - index.qmd
    - assignments/*.qmd
    - cheatsheets/*.qmd

website:
  title: "DSCI 522: Data Science Workflows (Students)"
  repo-url: https://github.com/UBC-MDS/DSCI_522_dsci-workflows_students
  repo-branch: main
  repo-actions: [edit]
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Cheatsheets
        menu:
          - href: cheatsheets/command_line.qmd
            text: "Command Line"
          - href: cheatsheets/git.qmd
            text: "Git"
          - href: cheatsheets/docker.qmd
            text: "Docker & Docker Compose"
          - href: cheatsheets/uv.qmd
            text: "uv"
          - href: cheatsheets/quarto.qmd
            text: "Quarto"
          - href: cheatsheets/makefile.qmd
            text: "Makefile"
    right:
      - href: https://ubc-dsci.github.io/reproducible-and-trustworthy-workflows-for-data-science/
        text: Textbook
      - icon: github
        href: https://github.com/UBC-MDS/DSCI_522_dsci-workflows_students
        aria-label: "Course GitHub repository"
  # Two sidebars: a page shows only the sidebar that lists it, so the
  # cheatsheet pages get their own sidebar instead of the syllabus one.
  sidebar:
    - id: course
      style: floating
      search: true
      contents:
        - href: index.qmd
          text: Syllabus
        - section: "Week 1"
          contents:
            - href: assignments/individual1.qmd
              text: "Individual Assignment 1"
            - href: assignments/milestone1.qmd
              text: "Milestone 1"
            - href: assignments/teamwork-contract.qmd
              text: "Teamwork Contract"
        # - section: "Week 2"
        #   contents:
        #     - href: assignments/individual2.qmd
        #       text: "Individual Assignment 2"
        #     - href: assignments/milestone2.qmd
        #       text: "Milestone 2"
        # - section: "Week 3"
        #   contents:
        #     - href: assignments/individual3.qmd
        #       text: "Individual Assignment 3"
        #     - href: assignments/milestone3.qmd
        #       text: "Milestone 3"
        # - section: "Week 4"
        #   contents:
        #     - href: assignments/individual4.qmd
        #       text: "Individual Assignment 4"
        #     - href: assignments/milestone4.qmd
        #       text: "Milestone 4"
        #     - href: assignments/peer-review.qmd
        #       text: "Peer Review"
        #     - href: assignments/teamwork-reflection.qmd
        #       text: "Teamwork Reflection"
        #     - href: assignments/bonus.qmd
        #       text: "Bonus: Project Website"
    - id: cheatsheets
      title: "Cheatsheets"
      style: floating
      search: true
      contents:
        - href: cheatsheets/command_line.qmd
          text: "Command Line"
        - href: cheatsheets/git.qmd
          text: "Git"
        - href: cheatsheets/docker.qmd
          text: "Docker & Docker Compose"
        - href: cheatsheets/uv.qmd
          text: "uv"
        - href: cheatsheets/quarto.qmd
          text: "Quarto"
        - href: cheatsheets/makefile.qmd
          text: "Makefile"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
