# ============================== RELEASE CONTROL ==============================
# Assignments and cheatsheets: every page is rendered.
# Students only find a page through the navbar and sidebars,
# so release an assignment or cheatsheet by uncommenting its entry below.
# The source files are public in this repo anyway.
#
# Section 1 slides: a lecture (or lab) counts as "released" when its slide deck
# is listed under `project: render:` below. To release lecture N, make two edits:
#
#   1. add  "slides/slides/slides_NN.qmd"  to `project: render:`
#   2. uncomment  - slides/lec_NN.qmd  in the `lectures` sidebar
#
# Labs work the same way, with "slides/slides/slides_lab_NN.qmd" and
# - slides/lab_NN.qmd in the `labs` sidebar.
#
# The schedule tables on slides/lecture.qmd and slides/lab.qmd
# (built by slides/_schedule.ejs) read this same render list: they link a
# lecture only when its deck is rendered. Unreleased lectures still appear in
# the table as plain text with a "coming soon" badge, and their decks are
# never rendered, so there is nothing to link to or guess the URL of.
# ============================================================================

project:
  type: website
  render:
    - index.qmd
    - assignments/*.qmd
    - cheatsheets/*.qmd
    - slides/*.qmd
    # Released Section 1 slide decks only: add one line per release.
    - "slides/slides/slides_01.qmd"
    - "slides/slides/slides_02.qmd"
    - "slides/slides/slides_03.qmd"
    # - "slides/slides/slides_04.qmd"
    # - "slides/slides/slides_05.qmd"
    # - "slides/slides/slides_06.qmd"
    # - "slides/slides/slides_07.qmd"
    # - "slides/slides/slides_08.qmd"
    - "slides/slides/slides_lab_01.qmd"
    # - "slides/slides/slides_lab_04.qmd"
    # Section 2 class notes: generated and pushed from Daniel Chen's private course repo
    # (`make publish` there commits only class-notes/).
    - "class-notes/index.qmd"
    - "class-notes/**/*.md"

# Section 2 class notes: the "Section 2 Notes" navbar menu and its sidebar are generated into
# this file by Daniel Chen's private course repo, and added to the menus and sidebars below.
metadata-files:
  - class-notes/_nav.yml

