            - href: assignments/milestone2.qmd
              text: "Milestone 2"
        # - section: "Week 3"
        #   contents:
        #     - href: assignments/individual3.qmd
        #       text: "Individual Assignment 3"
        #     - href: assignments/milestone3.qmd
        #       text: "Milestone 3"
        # - section: "Week 4"
