## Team work contract 


.bg-washed-blue.b--dark-blue.ba.bw2.br3.shadow-5.ph4.mt5[
In your team of 3-4:

- Spend 5-7 minutes in silence, and during this time, each team member comes up with 3 things to contribute to the team work contract.

- Paste all items from all group members into a collaborative document (e.g., Google docs, Microsoft word using UBC's Microsoft teams, Software Carpentry hack pad: https://pad.carpentries.org/)

- Organize items that are similar

- Discuss each group of items, and discuss which you agree to keep, and which you do not

**That is your teamwork contract!**
]

### Project organization

A good project structure looks similar to this:  

```bash
project/          
├── data/              *.csv        
│   ├── processed/
│   └── raw/     
├── reports/           *.ipynb *.Rmd
├── src/               *.py *.R
├── doc/               *.md
├── README.md
└── environment.yaml (or renv.lock)
```

**Not all this folders/files are going to be present in milestone 1**
---

## Milestone 1

```bash
project/          
├── data/                      
│   └── raw/ # downloaded data set           
├── src/  # scripts
├── README.md # Project proposal
├── LICENCE
├── CONTRIBUTING.md
└── CODE_OF_CONDUCT.md
```
