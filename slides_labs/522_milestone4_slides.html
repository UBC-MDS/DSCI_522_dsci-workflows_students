### 2. Include a `Dockerfile`

#### Is the same to use Docker than an `environment.yml` file for your project?

--
&gt; No

--

#### 🐍 **Conda** -  Package Management System
- Captures only the software and its versions used in an environment.

--

#### 🐳 **Docker** -  Containers
- Replicate an entire computational environment, _including the operating system_.

.footnote[Modified from [_The Turing Way_](https://the-turing-way.netlify.app/reproducible-research/renv/renv-options.html)]

---

### 2. Include a `Dockerfile`


- We are going to check that:
  - The final analysis is reproducible (this also means that the documentation is clear)
  - You indicate how to run `make` 
  - You pin your base image to the SHA version. For example:

**Dockerfile**
```bash
FROM scipy-notebook@sha256:b6a4ce777b837496d5612b7ce4efba9aa015576cb6993817721b8d293a7c2a3c
```
---
**Dockerfile**
```bash
FROM scipy-notebook@sha256:b6a4ce777b837496d5612b7ce4efba9aa015576cb6993817721b8d293a7c2a3c
```

```bash
