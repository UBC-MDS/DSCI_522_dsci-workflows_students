### How are we going to work in the labs?

--

#### Situation 1 - IN PERSON - **All the students of the group are present in the classroom**.    

- **Zoom** There is not necessary to join.   
- **Questions**  TAs in the classroom.  

--

####  Situation 2 - HYBRID -  **Part of the students of the group are online, part in person**.
- **Zoom** All the students of the group join the Zoom meeting in the break out room of the group. For example, group 21 will join break out room 21. 
- **Questions** These students can ask questions to the TAs in the classroom or online.

--

#### Situation 3 - ONLINE -  **All the students of the group are online**.
- **Zoom meeting** They will join their break out room. 
- **Questions** TA online.

## Milestone 2
#### Example: [breast_cancer_predictor project repo for milestone2]()


```bash
project/          
├── data/  
*│   └── processed/ # processed data sets (eg train and test)  
│   └── raw/ # downloaded data set           
├── src/  # scripts (now you will have more!)
*├── doc/  # documents (final report and files associated)
*├── results/  # figures and data sets with the results
├── README.md # Project proposal (Include usage!)
├── LICENCE
├── CONTRIBUTING.md
└── CODE_OF_CONDUCT.md
``` 


* This is not the unique possible project structure

* The important part here is that you should not make a flat directory structure.
