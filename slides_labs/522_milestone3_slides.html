```bash
# Count words.
isles.dat : books/isles.txt
	python countwords.py books/isles.txt isles.dat

```

### Create a Makefile!

* By default, **Make** looks for a file called `Makefile` when you run:

```bash
make
```

.bg-washed-blue.b--dark-blue.ba.bw2.br3.shadow-5.ph4.mt5[
What happens if you don't name the build file `Makefile`?
Does it runs?
]

.footnote[[Software Carpentry - Automation and Make](https://swcarpentry.github.io/make-novice/02-makefiles/index.html)]

---


### What happens if you don't name the build file `Makefile`?

* We need to tell **Make** where to find it. 
* We can do this using the `-f` flag. 

--

For example, if our `Makefile` is named `MyOtherMakefile`:

```bash
make -f MyOtherMakefile
```

.footnote[[Software Carpentry - Automation and Make](https://swcarpentry.github.io/make-novice/02-makefiles/index.html)]

### “Up to Date” Versus “Nothing to be Done” 

#### Up to date

```bash
$ make 
make: 'isles.dat' is up to date.
```
--
#### Nothing to be Done

```bash
$ make countwords.py
make: Nothing to be done for 'countwords.py'.
```

.bg-washed-blue.b--dark-blue.ba.bw2.br3.shadow-5.ph4.mt5[

What is going on? 

]

.footnote[[Software Carpentry - Automation and Make](https://swcarpentry.github.io/make-novice/02-makefiles/index.html)]
---

### “Up to Date” Versus “Nothing to be Done”
#### Up to date


```bash
make: 'isles.dat' is up to date.
```
Means that the Makefile has a rule with one or more actions whose target is the name of a file (or directory) and the file is up to date.


.footnote[[Software Carpentry - Automation and Make](https://swcarpentry.github.io/make-novice/02-makefiles/index.html)]
---

### “Up to Date” Versus “Nothing to be Done”
#### Nothing to be Done

```bash
make: Nothing to be done for 'countwords.py'
```

`Nothing to be done` means that the file exists but either:

* the Makefile has no rule for it, or
* the Makefile has a rule for it, but that rule has no actions

.footnote[[Software Carpentry - Automation and Make](https://swcarpentry.github.io/make-novice/02-makefiles/index.html)]

## 📜🖥️💾🖱

#### Why the following files are often written in uppercase letters?

* `README.md`
* `CODE_OF_CONDUCT.md` and
* `CONTRIBUTE.md` 
* `LICENSE`

--
  
What I found  
**In the past**: The order of the files when listed using the command line. In `ASCII` systems capital letters comes before small ones.  
**Today**: Writing these files in uppercase letters helps to promote their visibility within your repository.

.footnote[https://en.wikipedia.org/wiki/README]
---

### Should I always use the extension `.md` for these files?

No, plain text files also work.

##### Benefit:
* README.md -&gt; GitHub displays the file.

### GitHub Pages
#### I want an easier way to share my report!

* Render your report in `.html`
* Activate GitHub Pages. 
* Add at the end of the URL generated by GitHub the name of the report. For example here I added `help.html` at the end:
`https://ubc-mds.github.io/group_project_name_dsci_522/help.html`
* The file you want to use should be in the root of your project (or you should specify GitHub Pages where to find it)
* Be patient.
