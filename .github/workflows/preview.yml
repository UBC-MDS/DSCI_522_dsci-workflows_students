# PR deployment previews. Each PR gets its rendered site deployed to gh-pages
# under pr-preview/pr-<N>/ and a sticky bot comment with the URL. The preview
# is removed when the PR closes. Build steps mirror publish.yml; only the
# deploy target differs.
#
# Copied from UBC-MDS/DSCI_521_platforms-dsci, itself adapted from
# chendaniely/chendaniely.github.io (submodule caching and the
# R / Python setup steps dropped -- see the note in publish.yml).
#
# Known accepted caveat: a production deploy (publish.yml -> quarto publish)
# rewrites gh-pages and can delete pr-preview/; an open PR's preview
# regenerates on its next push.
#
# Note: previews only work for PRs from branches in this repository. A PR from
# a fork runs with a read-only token, so the deploy step will fail.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

name: PR Preview

# one preview build per PR at a time; a new push cancels the stale build
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push preview files to gh-pages
      pull-requests: write   # sticky preview comment
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build steps are skipped on 'closed' -- the preview-action step below
      # still runs and removes the preview directory.
      - name: Set up Quarto
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          version: release

      - name: Render site
        if: github.event.action != 'closed'
        run: quarto render

      # auto = deploy on opened/reopened/synchronize, remove on closed
      - name: Deploy PR preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: _site
          action: auto
